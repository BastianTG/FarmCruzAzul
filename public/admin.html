<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmCruzAzul - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f2f5; }
    nav { background: #1a1a2e; color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    nav h2 { font-size: 18px; }
    nav .nav-right { display: flex; align-items: center; gap: 16px; }
    nav .nav-right span { font-size: 14px; }
    .btn-logout { padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
    .tabs button { padding: 10px 24px; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; font-weight: 500; background: #ddd; color: #666; }
    .tabs button.active { background: white; color: #1a1a2e; font-weight: 600; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    table { width: 100%; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    th, td { padding: 10px 16px; text-align: left; font-size: 13px; }
    th { background: #f7f9fc; color: #555; font-weight: 600; }
    td { border-top: 1px solid #eee; }
    tr:hover td { background: #f8faff; }

    .btn-sm { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .btn-edit { background: #e3f2fd; color: #1565c0; }
    .btn-delete { background: #fbe9e7; color: #c62828; }
    .btn-add { background: #0b3d6b; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    .btn-add:hover { background: #1a6fb5; }
    .btn-primary { background: #0b3d6b; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-primary:hover { background: #1a6fb5; }
    .btn-secondary { background: #666; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-secondary:hover { background: #555; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
    .modal h3 { color: #1a1a2e; margin-bottom: 16px; }
    .modal .close { float: right; cursor: pointer; font-size: 24px; color: #888; }
    .modal .close:hover { color: #333; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .form-group input:focus, .form-group textarea:focus { border-color: #1a6fb5; outline: none; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button { flex: 1; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-pendiente { background: #fff3e0; color: #e65100; }
    .badge-en-tramite { background: #fff8e1; color: #f57f17; }
    .badge-enviado { background: #e8f5e9; color: #2e7d32; }
    .badge-admin { background: #fff3e0; color: #e65100; }
    .badge-user { background: #e8f5e9; color: #2e7d32; }
    .mfa-section { text-align: center; padding: 20px; }
    .mfa-section img { max-width: 200px; margin: 12px 0; }
    .mfa-section .secret { font-family: monospace; font-size: 14px; color: #555; background: #f5f5f5; padding: 8px 12px; border-radius: 6px; display: inline-block; margin: 8px 0; }
    .mfa-section .btn-primary { width: auto; padding: 10px 24px; margin-top: 8px; }
    .mfa-verify { margin-top: 16px; padding: 16px; background: #f8f9fa; border-radius: 8px; }
    .mfa-verify input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; text-align: center; letter-spacing: 4px; width: 160px; }
    .mfa-verify .btn-primary { width: auto; padding: 8px 20px; margin-top: 8px; }
    .mfa-status { margin: 8px 0; font-size: 14px; }
    .mfa-status .active { color: #2e7d32; font-weight: 600; }
    .mfa-status .inactive { color: #e65100; font-weight: 600; }
    .hidden { display: none; }

    .orden { border: 1px solid #eee; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .orden .header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .orden .items { font-size: 12px; color: #555; }
    .orden .total { text-align: right; font-size: 15px; font-weight: 700; color: #1a1a2e; margin-top: 6px; }
  </style>
</head>
<body>
  <nav>
    <h2>FarmCruzAzul — Panel Admin</h2>
    <div class="nav-right">
      <span id="userDisplay">Admin</span>
      <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>
  </nav>

  <div class="container">
    <div class="tabs">
      <button class="active" onclick="switchTab('productos', this)">Productos</button>
      <button onclick="switchTab('ordenes', this)">Órdenes</button>
      <button onclick="switchTab('usuarios', this)">Usuarios</button>
      <button onclick="switchTab('config', this)">Configuración</button>
    </div>

    <div id="tabProductos" class="tab-content active">
      <button class="btn-add" onclick="openProductModal()">+ Nuevo Producto</button>
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Laboratorio</th><th>Acciones</th></tr></thead>
        <tbody id="productosBody"></tbody>
      </table>
    </div>

    <div id="tabOrdenes" class="tab-content">
      <div id="ordenesList"></div>
    </div>

    <div id="tabUsuarios" class="tab-content">
      <table>
        <thead><tr><th>ID</th><th>Usuario</th><th>Email</th><th>Rol</th><th>Registro</th></tr></thead>
        <tbody id="usuariosBody"></tbody>
      </table>
    </div>

    <div id="tabConfig" class="tab-content">
      <div class="card">
        <h3>Autenticación de Dos Factores (MFA)</h3>
        <p style="color:#666;font-size:14px;margin-bottom:12px;">Protege tu cuenta con Google Authenticator.</p>
        <div class="mfa-status" id="mfaStatus">Cargando...</div>
        <div id="mfaSetupSection" class="hidden">
          <div class="mfa-section">
            <div id="mfaQrContainer"></div>
            <div class="secret" id="mfaSecret"></div>
            <div class="mfa-verify">
              <p style="font-size:13px;color:#555;margin-bottom:8px;">Ingresa el código de 6 dígitos:</p>
              <input type="text" id="mfaVerifyCode" maxlength="6" placeholder="000000">
              <button class="btn-primary" onclick="verifyMfaSetup()">Confirmar</button>
              <div class="error" id="mfaSetupError" style="color:#e74c3c;margin-top:8px;display:none;"></div>
              <div class="success" id="mfaSetupSuccess" style="color:#2e7d32;margin-top:8px;display:none;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Producto -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <span class="close" onclick="closeProductModal()">&times;</span>
      <h3 id="productModalTitle">Nuevo Producto</h3>
      <input type="hidden" id="prodId">
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" id="prodNombre">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="prodDescripcion" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Precio *</label>
        <input type="number" id="prodPrecio" step="0.01">
      </div>
      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="prodStock">
      </div>
      <div class="form-group">
        <label>Laboratorio</label>
        <input type="text" id="prodLaboratorio">
      </div>
      <div class="form-group">
        <label>URL Imagen</label>
        <input type="text" id="prodImagen">
      </div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="saveProduct()">Guardar</button>
        <button class="btn-secondary" onclick="closeProductModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/'; }

    function formatPrecio(n) { return '$' + Number(n).toLocaleString('es-CL'); }

    function logout() { localStorage.removeItem('token'); window.location.href = '/'; }

    function switchTab(name, btn) {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
    }

    // --- Productos ---
    async function loadProductos() {
      try {
        const res = await fetch('/api/productos');
        const prods = await res.json();
        const tbody = document.getElementById('productosBody');
        tbody.innerHTML = '';
        prods.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>${formatPrecio(p.precio)}</td>
            <td>${p.stock}</td>
            <td>${p.laboratorio || '-'}</td>
            <td>
              <button class="btn-sm btn-edit" onclick="editProduct(${p.id})">Editar</button>
              <button class="btn-sm btn-delete" onclick="deleteProduct(${p.id})">Eliminar</button>
            </td>`;
          tbody.appendChild(tr);
        });
      } catch (err) { console.error(err); }
    }

    function openProductModal(prod) {
      document.getElementById('productModal').classList.add('active');
      if (prod) {
        document.getElementById('productModalTitle').textContent = 'Editar Producto';
        document.getElementById('prodId').value = prod.id;
        document.getElementById('prodNombre').value = prod.nombre;
        document.getElementById('prodDescripcion').value = prod.descripcion || '';
        document.getElementById('prodPrecio').value = prod.precio;
        document.getElementById('prodStock').value = prod.stock;
        document.getElementById('prodLaboratorio').value = prod.laboratorio || '';
        document.getElementById('prodImagen').value = prod.imagen_url || '';
      } else {
        document.getElementById('productModalTitle').textContent = 'Nuevo Producto';
        document.getElementById('prodId').value = '';
        document.getElementById('prodNombre').value = '';
        document.getElementById('prodDescripcion').value = '';
        document.getElementById('prodPrecio').value = '';
        document.getElementById('prodStock').value = '0';
        document.getElementById('prodLaboratorio').value = '';
        document.getElementById('prodImagen').value = '';
      }
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    async function saveProduct() {
      const id = document.getElementById('prodId').value;
      const data = {
        nombre: document.getElementById('prodNombre').value,
        descripcion: document.getElementById('prodDescripcion').value,
        precio: parseFloat(document.getElementById('prodPrecio').value),
        stock: parseInt(document.getElementById('prodStock').value) || 0,
        laboratorio: document.getElementById('prodLaboratorio').value,
        imagen_url: document.getElementById('prodImagen').value,
      };
      if (!data.nombre || !data.precio) { alert('Nombre y precio son requeridos'); return; }

      try {
        const url = id ? `/api/productos/${id}` : '/api/productos';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(data),
        });
        if (!res.ok) { const e = await res.json(); alert('Error: ' + e.error); return; }
        closeProductModal();
        loadProductos();
      } catch (err) { alert('Error de conexión'); }
    }

    async function editProduct(id) {
      const res = await fetch('/api/productos');
      const prods = await res.json();
      const prod = prods.find(p => p.id === id);
      if (prod) openProductModal(prod);
    }

    async function deleteProduct(id) {
      if (!confirm('¿Eliminar este producto?')) return;
      try {
        const res = await fetch(`/api/productos/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` },
        });
        if (!res.ok) { const e = await res.json(); alert('Error: ' + e.error); return; }
        loadProductos();
      } catch (err) { alert('Error de conexión'); }
    }

    // --- Órdenes ---
    async function loadOrdenes() {
      try {
        const res = await fetch('/api/ordenes/todas', { headers: { 'Authorization': `Bearer ${token}` } });
        const ordenes = await res.json();
        const list = document.getElementById('ordenesList');
        list.innerHTML = '';
        if (ordenes.length === 0) {
          list.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">No hay órdenes registradas.</p>';
          return;
        }
        ordenes.forEach(o => {
          const div = document.createElement('div');
          div.className = 'orden';
          const estadoClass = o.estado === 'en trámite' ? 'en-tramite' : o.estado;
          div.innerHTML = `
            <div class="header">
              <span><strong>#${o.id}</strong> — ${o.username} — ${new Date(o.created_at).toLocaleDateString()}</span>
              <select onchange="updateEstado(${o.id}, this.value)" style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:12px;font-weight:600;background:${o.estado === 'pendiente' ? '#fff3e0' : o.estado === 'en trámite' ? '#fff8e1' : '#e8f5e9'};color:${o.estado === 'pendiente' ? '#e65100' : o.estado === 'en trámite' ? '#f57f17' : '#2e7d32'}">
                <option value="pendiente" ${o.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                <option value="en trámite" ${o.estado === 'en trámite' ? 'selected' : ''}>En trámite</option>
                <option value="enviado" ${o.estado === 'enviado' ? 'selected' : ''}>Enviado</option>
              </select>
            </div>
            <div class="items">${o.items.map(i => `${i.nombre} x${i.cantidad} — ${formatPrecio(i.precio_unitario * i.cantidad)}`).join('<br>')}</div>
            <div class="total">Total: ${formatPrecio(o.total)}</div>`;
          list.appendChild(div);
        });
      } catch (err) { console.error(err); }
    }

    // --- Usuarios ---
    async function loadUsuarios() {
      try {
        const res = await fetch('/api/usuarios', { headers: { 'Authorization': `Bearer ${token}` } });
        const usuarios = await res.json();
        const tbody = document.getElementById('usuariosBody');
        tbody.innerHTML = '';
        usuarios.forEach(u => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>${u.email || '-'}</td>
            <td><span class="badge ${u.rol === 'admin' ? 'badge-admin' : 'badge-user'}">${u.rol}</span></td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>`;
          tbody.appendChild(tr);
        });
      } catch (err) { console.error(err); }
    }

    async function updateEstado(ordenId, estado) {
      try {
        const res = await fetch(`/api/ordenes/${ordenId}/estado`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ estado }),
        });
        if (!res.ok) { const e = await res.json(); alert('Error: ' + e.error); }
      } catch (err) { alert('Error de conexión'); }
    }

    async function loadProfile() {
      try {
        const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) { logout(); return; }
        const data = await res.json();
        if (data.user.rol !== 'admin') { window.location.href = '/dashboard.html'; return; }
        document.getElementById('userDisplay').textContent = 'Admin: ' + data.user.username;
      } catch (err) { logout(); }
    }

    async function checkMfaStatus() {
      try {
        const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const hasMfa = data.user.mfa_secret && data.user.mfa_secret.length > 0;
        document.getElementById('mfaStatus').innerHTML = hasMfa
          ? 'Estado: <span class="active">Activado</span>'
          : 'Estado: <span class="inactive">No configurado</span>';
        if (!hasMfa) {
          const setupRes = await fetch('/auth/setup-mfa', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
          });
          const setupData = await setupRes.json();
          if (setupRes.ok) {
            document.getElementById('mfaSetupSection').classList.remove('hidden');
            document.getElementById('mfaQrContainer').innerHTML = `<img src="${setupData.qrCode}" alt="QR Code">`;
            document.getElementById('mfaSecret').textContent = `Secreto: ${setupData.secret}`;
          }
        }
      } catch (err) { console.error(err); }
    }

    async function verifyMfaSetup() {
      const code = document.getElementById('mfaVerifyCode').value;
      const errEl = document.getElementById('mfaSetupError');
      const successEl = document.getElementById('mfaSetupSuccess');
      if (!code || code.length !== 6) { errEl.textContent = 'Ingresa el código de 6 dígitos'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      try {
        const res = await fetch('/auth/verify-mfa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ mfaCode: code }),
        });
        const data = await res.json();
        if (res.ok) {
          successEl.textContent = 'MFA configurado exitosamente.';
          successEl.style.display = 'block';
          document.getElementById('mfaStatus').innerHTML = 'Estado: <span class="active">Activado</span>';
          document.getElementById('mfaSetupSection').classList.add('hidden');
        } else {
          errEl.textContent = data.error || 'Código inválido';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Error de conexión';
        errEl.style.display = 'block';
      }
    }

    loadProfile();
    loadProductos();
    loadOrdenes();
    loadUsuarios();
    checkMfaStatus();
  </script>
</body>
</html>
